# Haab seating convention, pinned per source.
# Package: wave-2-cycles-and-seating.
#
# Three independent sources were consulted (each opened and read for this
# file); every record's notes state which source it comes from, which seating
# convention that source follows, and the page where that convention is
# stated or exemplified:
#   - Kettunen, Harri, and Christophe Helmke. 2019. Introduction to Maya
#     Hieroglyphs. Sixteenth revised edition. Wayeb.
#     Convention: the first day of a month is its "seating"; month-day
#     coefficients written numerically 0-19 (stated p. 49, exemplified
#     pp. 51-52).
#   - Stuart, David. 2004. "New Year Records in Classic Maya Inscriptions."
#     The PARI Journal 5(2):1-6.
#     Convention: the seating written glyphically as "Seating of <month>",
#     the station immediately before "1 <month>" (exemplified pp. 1, 5, 6).
#   - Martin, Simon, and Joel Skidmore. 2012. "Exploring the 584286
#     Correlation." The PARI Journal 13(2):3-16.
#     Convention: numeric 0-based seating ("0 Pop" precedes "1 Pop",
#     Figures 13-14, p. 13); the Colonial-era count recorded by Landa runs
#     one day lower (12 K'an 1 Pop where the Classic count has 12 K'an
#     2 Pop, pp. 4, 10-13).
#
# All three sources agree on the seating convention itself: the seated day
# is the first day of the month and immediately precedes "1 <month>". The
# genuine divergences documented BY these sources (Classic vs Colonial/
# Puuc-style counting; Thompson's 1-Pop year bearers vs Stuart's
# seating-of-Pop year bearers) are recorded in the notes below and reported
# as findings in the pull request — per contract they are not averaged or
# resolved here.

- id: seat-kh-0-sotz
  long_count: "9.8.19.17.17"
  calendar_round: "13 Kaban 0 Sotz'"
  lord_of_night: G6
  maya_day_number: 1360797
  provenance: attested
  source: "Kettunen & Helmke 2019, Introduction to Maya Hieroglyphs, 16th ed., p. 52 (correlation example table)"
  checked: "2026-09-21"
  notes: >-
    Source: Kettunen & Helmke 2019. Seating convention of this source:
    "The beginning of the month was called the 'seating' of the month,
    and after 19 days Pop is completed and the next month (Wo) is
    'seated'" (p. 49); coefficients written numerically 0-19, with the
    seated day as 0 — exemplified on p. 52, where the table runs
    9.8.19.17.16 "12 Kib 19 Sip" directly into 9.8.19.17.17 "13 Kaban
    0 Sotz'" (this record), and on p. 51, where 0 appears among the
    possible haab coefficients (Kaban takes 5/10/15/0). G6 as given in
    the same p. 52 table row. MDN hand-checked: 9x144000 + 8x7200 +
    19x360 + 17x20 + 17 = 1360797.

- id: seat-kh-0-sek
  long_count: "9.9.0.0.17"
  calendar_round: "7 Kaban 0 Sek"
  lord_of_night: G8
  maya_day_number: 1360817
  provenance: attested
  source: "Kettunen & Helmke 2019, Introduction to Maya Hieroglyphs, 16th ed., p. 52 (correlation example table)"
  checked: "2026-09-21"
  notes: >-
    Source: Kettunen & Helmke 2019. Same seating convention as
    seat-kh-0-sotz (stated p. 49: seated day begins the month; numeric
    0-19 coefficients): the p. 52 table runs 9.9.0.0.16 "6 Kib 19 Sotz'"
    directly into 9.9.0.0.17 "7 Kaban 0 Sek" (this record), with G8.
    Second in-source exemplification, showing the convention holds
    across month boundaries generally, not only at Sotz'.

- id: seat-stuart-naranjo-st18
  long_count: "9.14.14.7.2"
  calendar_round: "1 Ik' 0 Pop"
  maya_day_number: 1401982
  provenance: attested
  source: "Stuart 2004, 'New Year Records in Classic Maya Inscriptions', The PARI Journal 5(2), pp. 1-2 (Naranjo Stela 18)"
  checked: "2026-09-21"
  notes: >-
    Source: Stuart 2004. Seating convention of this source: the seating
    is written glyphically as "Seating of Pop" — Naranjo Stela 18 records
    "1 Ik' Seating of Pop", corresponding to Long Count 9.14.14.7.2
    (p. 1); Stuart calls it "the 'seating' of the initial month" and
    treats it as the New Year station (p. 2). Numeric rendering "0 Pop"
    here follows the 0-19 convention of Kettunen & Helmke 2019:49, to
    which Stuart's "Seating of Pop" is equivalent (the day before 1 Pop).
    Divergence documented by this source, reported not resolved: Stuart
    argues the Classic year bearers fell on the seating of Pop (pp. 3-4),
    while Thompson held they fell on 1 Pop, the first numbered day
    (Thompson 1950:124-127, as quoted by Stuart 2004:3; Thompson 1950
    was not independently consulted for this file). MDN hand-checked:
    9x144000 + 14x7200 + 14x360 + 7x20 + 2 = 1401982; residue checks:
    1401982 mod 13 = 10, 4 + 10 = 14 -> 1 (coefficient 1); 1401982 mod
    20 = 2, Ajaw + 2 = Ik'; year-day (348 + 1401982) mod 365 = 0 = 0 Pop.

- id: seat-stuart-copan-altar-u
  long_count: "9.18.2.5.17"
  calendar_round: "3 Kaban 0 Pop"
  maya_day_number: 1426437
  provenance: attested
  source: "Stuart 2004, 'New Year Records in Classic Maya Inscriptions', The PARI Journal 5(2), p. 5 (Copan Altar U)"
  checked: "2026-09-21"
  notes: >-
    Source: Stuart 2004. Copan Altar U "bears an inscription opening
    with the Calendar Round 3 Kaban Seating of Pop, corresponding to
    9.18.2.5.17" (p. 5); the same page cites the related record
    9.17.9.2.12 "3 Eb Seating of Pop" as a seating in office on a New
    Year. Seating convention of this source: glyphic "Seating of Pop",
    the station before 1 Pop (see seat-stuart-naranjo-st18); numeric
    "0 Pop" rendering per Kettunen & Helmke 2019:49. MDN hand-checked:
    9x144000 + 18x7200 + 2x360 + 5x20 + 17 = 1426437; year-day
    (348 + 1426437) mod 365 = 0 = 0 Pop.

