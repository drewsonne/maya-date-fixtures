- id: seat-stuart-txix-house-e-sak
  long_count: "2.0.0.10.2"
  calendar_round: "9 Ik' 0 Sak"
  lord_of_night: G4
  maya_day_number: 288202
  provenance: attested
  source: "Stuart 2005, The Inscriptions from Temple XIX at Palenque, PARI, p. 84 (Temple XVIII jambs; Palace House E painted text)"
  checked: "2026-09-21"
  notes: >-
    Source: Stuart, David. 2005. The Inscriptions from Temple XIX at
    Palenque: A Commentary (opened and read for this file). Stuart 2005:84
    records "2.0.0.10.2 9 Ik' Seating of Sak" as "well anchored", cited
    on the Temple XVIII jambs and in the House E painted text (which
    also provides Glyph G4, "correct for a 2.0.0.10.2 placement").
    Seating convention of this source: glyphic "Seating of <month>"
    notation for months generally (Sak and Yax on the same page), the
    station before "1 <month>"; numeric "0 Sak" rendering per Kettunen &
    Helmke 2019:49. Shows the seating convention applies to any month,
    not just the New Year seating of Pop. MDN hand-checked: 2x144000 +
    10x20 + 2 = 288202; year-day (348 + 288202) mod 365 = 200 = 0 Sak
    (Sak is the 11th month, days 200-219; month order per Kettunen &
    Helmke 2019:58-59).

- id: seat-ms-classic-vs-landa
  long_count: "11.16.13.16.4"
  calendar_round: "12 K'an 2 Pop"
  maya_day_number: 1704204
  provenance: attested
  source: "Martin & Skidmore 2012, The PARI Journal 13(2), pp. 4, 13"
  checked: "2026-09-21"
  notes: >-
    Source: Martin & Skidmore 2012. Seating convention of this source:
    numeric 0-based — their Figures 13-14 (p. 13) run "11 Ak'bal 0 Pop"
    into "12 K'an 1 Pop"/"12 K'an 2 Pop", exemplifying 0 Pop as the
    seated day before 1 Pop. This record is the Classic-convention
    Calendar Round 12 K'an 2 Pop for 11.16.13.16.4, MDN 1,704,204
    (p. 4). Divergence documented by this source, reported not resolved:
    Landa's Relacion records the same day as "12 K'an 1 Pop" — New
    Year's Day in the Colonial Maya calendar — a Calendar Round "deemed
    'impossible'" in the Classic system, where K'an pairs with 2 Pop
    (pp. 4, 10-12); Classic "Puuc-style" dates likewise carry month
    coefficients one lower than expected, which Stuart interprets as
    records of nighttime events later fossilized into the Colonial norm
    (Martin & Skidmore 2012:5, citing Stuart). This is a divergence
    between the Classic and Colonial counting systems as documented
    within the sources consulted, not a disagreement between those
    sources; both conventions are recorded here side by side, never
    averaged.
