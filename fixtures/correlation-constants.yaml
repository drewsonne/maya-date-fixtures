# Western conversion pinned under each supported correlation constant.
# Three triples; within a triple all records share one Long Count (and id prefix)
# and differ only in the correlation constant. Per the wave-2 red-team advisory
# (maya-project ADR 0020): every record carries julian_day_number so the
# constant differences (584285-584283=2, 584286-584285=1, 584286-584283=3) are
# checkable numerically; no western date below was produced by adding a day
# offset to a sibling record's gregorian_proleptic - each is either quoted from
# a source actually opened or re-derived from the JDN with the steps shown.
#
# Sources actually opened for this file:
# - Martin, Simon, and Joel Skidmore. 2012. "Exploring the 584286 Correlation
#   between the Maya and European Calendars." The PARI Journal 13(2):3-16.
#   (mesoweb.com/pari/publications/journal/1302/Correlation.pdf) - "M&S 2012".
# - Kettunen, Harri, and Christophe Helmke. 2018. Introduction to Maya
#   Hieroglyphs. Wayeb workshop handbook, EMC 2018.
#   (wayeb.org/wp-content/uploads/2018/11/Kettunen_Helmke_WH_English_EMC2018.pdf)
#   Appendix table "Julian Day Numbers (JDN) for January 1st in the Gregorian
#   calendar (years AD 1-2000)", p. 53 - "K&H 2018". Anchors used from that
#   table: JDN 1976730 = 1 Jan 700; JDN 2013254 = 1 Jan 800; JDN 2268924 =
#   1 Jan 1500; JDN 2305448 = 1 Jan 1600; JDN 2451545 = 1 Jan 2000 (all
#   proleptic Gregorian).

# --- Triple 1: bak'tun-13 end of 2012, Long Count 13.0.0.0.0, MDN 1872000 ---
# All three western dates in this triple are printed in one sentence of
# M&S 2012:12 (quoted in each record); each record additionally shows the full
# JDN arithmetic, so the difference check is numeric, not by construction.

- id: b13-2012-584283
  long_count: "13.0.0.0.0"
  maya_day_number: 1872000
  julian_day_number: 2456283
  gregorian_proleptic: "2012-12-21"
  correlation: 584283
  provenance: attested
  source: "Martin & Skidmore 2012, The PARI Journal 13(2), p. 12 (body text, not a table)"
  checked: "2026-09-21"
  notes: >-
    As printed on p. 12: "the thirteenth Bak'tun will end on December 21, 2012,
    which is the date in the 584283 correlation, as opposed to December 23 in
    the 584285 correlation (or Christmas Eve, December 24, according to
    584286)." Derivation: MDN = 13x144000 = 1872000; JDN = 1872000 + 584283 =
    2456283. JDN-to-Gregorian check against K&H 2018:53 anchor JDN 2451545 =
    2000-01-01: 2456283 - 2451545 = 4738 days; 2000-01-01 + 12y (12x365 + leap
    days 2000, 2004, 2008 = 4383) = 2012-01-01 at JDN 2455928; 4738 - 4383 =
    355 days after 2012-01-01 = day-of-year 356 of leap year 2012 = 2012-12-21.
    Julian calendar date: 2012-12-08 (Gregorian = Julian + 13 at this date; see
    pw-2012-b13-end in proleptic-western.yaml for the Julian-side day count).

- id: b13-2012-584285
  long_count: "13.0.0.0.0"
