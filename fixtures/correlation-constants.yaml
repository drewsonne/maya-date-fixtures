    1872000; JDN = 1872000 + 584285 = 2456285. JDN-to-Gregorian check against
    K&H 2018:53 anchor JDN 2451545 = 2000-01-01: 2456285 - 2451545 = 4740;
    4740 - 4383 (to 2012-01-01) = 357 days after 2012-01-01 = day-of-year 358
    of leap year 2012 = 2012-12-23. Julian calendar date: 2012-12-10
