# --- Triple 2: Poco Uinic Stela 3 eclipse day, Long Count 9.17.19.13.16,
# MDN 1425516. Attested member: 584286 (the paper's headline claim). The
# 584283 and 584285 members are derived by JDN arithmetic only. ---

- id: poco-uinic-584286
  long_count: "9.17.19.13.16"
  calendar_round: "5 Kib 14 Ch'en"
  maya_day_number: 1425516
  julian_day_number: 2009802
  gregorian_proleptic: "0790-07-20"
  correlation: 584286
  provenance: attested
  source: "Martin & Skidmore 2012, The PARI Journal 13(2), pp. 6-7 and Figure 5 (p. 7)"
  checked: "2026-09-21"
  notes: >-
    Figure 5 caption as printed: "The Poco Uinic eclipse, which occurred on
    European calendar day July 16, 790 ce and Maya Day 9.17.19.13.16." Body
    p. 7 as printed: "The Julian Day Number (JDN) assigned to July 16, 790, is
    2009802. The Maya Day Number (MDN) of the Long Count 9.17.19.13.16 is
    1425516", followed by the column subtraction "2009802 Julian Day Number /
    - 1425516 Maya Day Number / 584286". Calendar Round p. 6 as printed:
    "a Calendar Round of 5 Kib 14 Ch'en that is unambiguously fixed to the
    Long Count at 9.17.19.13.16". MDN check: 9x144000 + 17x7200 + 19x360 +
    13x20 + 16 = 1425516. The printed date 16 July 790 is a Julian calendar
    date (pre-1582 "European calendar"). Only gregorian_proleptic is a
    re-expression derived here, not printed: from K&H 2018:53 anchor JDN
    2013254 = 0800-01-01 Gregorian, 2013254 - 2009802 = 3452 days. Check:
    0790-07-20 to 0800-07-20 = 10x365 + 3 leap days (Feb 29 of 792, 796, 800)
    = 3653 days; elapsed days 0800-01-01 to 0800-07-20 = day-of-year 202 - 1
    = 201 (leap year 800); 3653 - 201 = 3452. Hence JDN 2009802 = 0790-07-20
    proleptic Gregorian; Gregorian = Julian + 4 at this date (July 20 - July
    16).

- id: poco-uinic-584285
  long_count: "9.17.19.13.16"
  calendar_round: "5 Kib 14 Ch'en"
  maya_day_number: 1425516
  julian_day_number: 2009801
  gregorian_proleptic: "0790-07-19"
  correlation: 584285
  provenance: derived
  source: "Anchors: Martin & Skidmore 2012:7 (JDN 2009802 = 16 July 790 Julian); Kettunen & Helmke 2018:53 (JDN 2013254 = 1 Jan 800 Gregorian)"
  checked: "2026-09-21"
  notes: >-
    Derived, not printed in any source consulted. MDN = 9x144000 + 17x7200 +
    19x360 + 13x20 + 16 = 1425516. JDN = 1425516 + 584285 = 2009801.
    JDN-to-Julian: attested anchor JDN 2009802 = 0790-07-16 Julian (M&S
    2012:7); 2009801 = 2009802 - 1, one day earlier within July = 0790-07-15
    Julian. JDN-to-Gregorian, independently of the Julian side: K&H 2018:53
    anchor JDN 2013254 = 0800-01-01 Gregorian; 2013254 - 2009801 = 3453;
    0790-07-19 to 0800-07-19 = 10x365 + 3 leap days (792, 796, 800) = 3653;
    0800-01-01 to 0800-07-19 elapsed = day-of-year 201 - 1 = 200; 3653 - 200 =
    3453, so JDN 2009801 = 0790-07-19 proleptic Gregorian. Offset check:
    Gregorian = Julian + 4 at this date.

- id: poco-uinic-584283
  long_count: "9.17.19.13.16"
  calendar_round: "5 Kib 14 Ch'en"
  maya_day_number: 1425516
  julian_day_number: 2009799
  gregorian_proleptic: "0790-07-17"
  correlation: 584283
  provenance: derived
  source: "Anchors: Martin & Skidmore 2012:7 (JDN 2009802 = 16 July 790 Julian); Kettunen & Helmke 2018:53 (JDN 2013254 = 1 Jan 800 Gregorian)"
  checked: "2026-09-21"
  notes: >-
    Derived, not printed in any source consulted. MDN = 9x144000 + 17x7200 +
    19x360 + 13x20 + 16 = 1425516. JDN = 1425516 + 584283 = 2009799.
    JDN-to-Julian: attested anchor JDN 2009802 = 0790-07-16 Julian (M&S
    2012:7); 2009799 = 2009802 - 3, three days earlier within July =
    0790-07-13 Julian. JDN-to-Gregorian, independently of the Julian side:
    K&H 2018:53 anchor JDN 2013254 = 0800-01-01 Gregorian; 2013254 - 2009799 =
    3455; 0790-07-17 to 0800-07-17 = 10x365 + 3 leap days (792, 796, 800) =
    3653; 0800-01-01 to 0800-07-17 elapsed = day-of-year 199 - 1 = 198;
    3653 - 198 = 3455, so JDN 2009799 = 0790-07-17 proleptic Gregorian.
    Offset check: Gregorian = Julian + 4 at this date.

# --- Triple 3: Landa's 1553 Maya New Year (12 K'an 1 Pop), Long Count
# 11.16.13.16.4, MDN 1704204. Attested members: 584286 (Figure 16) and 584283
# (Figure 11); the 584285 member is derived by JDN arithmetic. ---

- id: landa-1553-584286
  long_count: "11.16.13.16.4"
  calendar_round: "12 K'an 1 Pop"
  maya_day_number: 1704204
  julian_day_number: 2288490
  gregorian_proleptic: "1553-07-28"
  correlation: 584286
  provenance: attested
  source: "Martin & Skidmore 2012, The PARI Journal 13(2), p. 14, Figure 16; ten-day Julian-Gregorian offset per footnote 14, p. 12"
  checked: "2026-09-21"
  notes: >-
    Figure 16 (p. 14) as printed: "July 18 (Greenwich) JDN 2288490",
    "11.16.13.16.4 12 K'an 1 Pop", and the equation "JDN 2288490 - MDN
    1704204 = 584286"; caption "The Classic system (with the Long Count
    changing at sunset) extended to July 17, 1553." MDN check: 11x144000 +
    16x7200 + 13x360 + 16x20 + 4 = 1704204. The printed 18 July 1553 is a
    Julian (O.S.) date; footnote 14 (p. 12) as printed: "Thompson gives his
    dates in the Julian calendar's successor, our current Gregorian, which can
    be adjusted to the Julian by adding ten days (thus the 'Landa date' is
    July 26 in the Gregorian calendar)" - i.e. by its own example, Gregorian =
    Julian + 10 in 1553, so 18 July Julian = 28 July Gregorian.
    gregorian_proleptic independently checked against K&H 2018:53 anchor JDN
    2268924 = 1500-01-01 Gregorian: 2288490 - 2268924 = 19566; 1500-01-01 +
    53y = 1553-01-01 after 53x365 + 13 leap days (1504...1552) = 19358 days;
    19566 - 19358 = 208 days after 1553-01-01 = day-of-year 209 of common year
    1553 = 1553-07-28.

- id: landa-1553-584285
  long_count: "11.16.13.16.4"
  calendar_round: "12 K'an 1 Pop"
  maya_day_number: 1704204
  julian_day_number: 2288489
  gregorian_proleptic: "1553-07-27"
  correlation: 584285
  provenance: derived
  source: "Anchors: Martin & Skidmore 2012:14, Figure 16 (JDN 2288489 = July 17 (Greenwich) 1553, Julian); Kettunen & Helmke 2018:53 (JDN 2268924 = 1 Jan 1500 Gregorian)"
  checked: "2026-09-21"
  notes: >-
    Derived: no source consulted prints this pairing under 584285. MDN =
    11x144000 + 16x7200 + 13x360 + 16x20 + 4 = 1704204. JDN = 1704204 +
    584285 = 2288489. JDN-to-Julian: Figure 16 (M&S 2012:14) prints "July 17
    (Greenwich) JDN 2288489", so JDN 2288489 = 1553-07-17 Julian.
    JDN-to-Gregorian, independently: K&H 2018:53 anchor JDN 2268924 =
    1500-01-01 Gregorian; 2288489 - 2268924 = 19565; to 1553-01-01 is 19358
    days (53x365 + 13 leap days 1504...1552); 19565 - 19358 = 207 days after
    1553-01-01 = day-of-year 208 of common year 1553 = 1553-07-27. Offset
    check: Gregorian = Julian + 10 at this date (footnote 14, M&S 2012:12).

- id: landa-1553-584283
  long_count: "11.16.13.16.4"
  calendar_round: "12 K'an 1 Pop"
  maya_day_number: 1704204
  julian_day_number: 2288487
  gregorian_proleptic: "1553-07-25"
  correlation: 584283
  provenance: attested
  source: "Martin & Skidmore 2012, The PARI Journal 13(2), p. 12, Figure 11; ten-day Julian-Gregorian offset per footnote 14, p. 12"
  checked: "2026-09-21"
  notes: >-
    Figure 11 (p. 12) as printed: "11.16.13.16.4 12 K'an 1 Pop (15 July 1553)",
