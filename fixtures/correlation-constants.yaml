    Day (1 Pop) in the Colonial-era Maya calendar. The European calendar dates
    are per the 584283 correlation." The printed 15 July 1553 is Julian
    (O.S.); Gregorian = Julian + 10 in 1553 (footnote 14, p. 12), so 25 July
    1553 Gregorian. Derivation: MDN = 11x144000 + 16x7200 + 13x360 + 16x20 +
    4 = 1704204; JDN = 1704204 + 584283 = 2288487; JDN-to-Julian via the
    Figure 16 anchor JDN 2288489 = 1553-07-17 Julian: 2288487 = 2288489 - 2 =
    1553-07-15 Julian, agreeing with Figure 11 as printed. JDN-to-Gregorian,
    independently: K&H 2018:53 anchor JDN 2268924 = 1500-01-01 Gregorian;
    2288487 - 2268924 = 19563; 19563 - 19358 (to 1553-01-01) = 205 days after
    1553-01-01 = day-of-year 206 of common year 1553 = 1553-07-25.
