  long_count: "9.9.1.0.4"
  maya_day_number: 1361164
  provenance: derived
  source: "Anchor row from Kettunen & Helmke 2020, Introduction to Maya Hieroglyphs, Wayeb, Appendix p. 52, correlation table (9.9.0.1.4 = 1 K'an 7 Sek G6); result is hand-derived below"
  checked: "2026-09-21"
  notes: |
    Direction: forward across the tun rollover (winal column wraps at 18, base-18).
    Anchor: 9.9.0.1.4 (1 K'an 7 Sek, G6 per the cited table), anchor MDN = 9*144000 + 9*7200 + 0*360 + 1*20 + 4 = 1360824.
    DN: 17.0 (17 winal, 0 k'in) = 17*20 = 340 days.
    Column-wise addition with carries: k'in 4 + 0 = 4; winal 1 + 17 = 18 -> write 0, carry 1 tun (winal is base-18); tun 0 + 0 + 1 = 1; k'atun 9; bak'tun 9 => 9.9.1.0.4.
    Reconciliation: result MDN = anchor MDN + DN days = 1360824 + 340 = 1361164 = 9*144000 + 9*7200 + 1*360 + 0*20 + 4.
    The result date lies beyond the end of the cited table, so no Calendar Round is asserted for it; the Long Count and MDN follow entirely from the hand arithmetic shown.

