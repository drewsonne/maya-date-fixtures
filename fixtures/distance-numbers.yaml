# --- bak'tun rollover (k'atun column wraps at 20) ---

- id: "dn-baktun-fwd_anchor-9.19.19.17.19_plus-1"
  long_count: "10.0.0.0.0"
  maya_day_number: 1440000
  provenance: derived
  checked: "2026-09-21"
  notes: |
    Direction: forward across the bak'tun rollover; a single-day DN whose carry cascades through every column.
    Anchor: 9.19.19.17.19, the last day of bak'tun 9, anchor MDN = 9*144000 + 19*7200 + 19*360 + 17*20 + 19 = 1296000 + 136800 + 6840 + 340 + 19 = 1439999.
    DN: 1 (1 k'in) = 1 day.
    Column-wise addition with carries: k'in 19 + 1 = 20 -> write 0, carry 1 winal; winal 17 + 1 = 18 -> write 0, carry 1 tun (winal is base-18); tun 19 + 1 = 20 -> write 0, carry 1 k'atun; k'atun 19 + 1 = 20 -> write 0, carry 1 bak'tun; bak'tun 9 + 1 = 10 => 10.0.0.0.0.
    Reconciliation: result MDN = anchor MDN + DN days = 1439999 + 1 = 1440000 = 10*144000.
    Fully hand-derived positional arithmetic; no Calendar Round is asserted because no published source was consulted for these endpoints.

