# Distance-number (DN) arithmetic vectors: forward and backward across winal,
# tun, k'atun and bak'tun rollovers, plus a chained (two-DN) vector.
#
# Conventions used in this file:
# - Each record's long_count / calendar_round / maya_day_number describe the
#   RESULT of applying the distance number; the DN expression, direction and
#   anchor are encoded in the id and spelled out in notes.
# - DN digits are written in Long Count order bak'tun.k'atun.tun.winal.k'in
#   (shorter DNs omit leading positions), e.g. DN 1.6 = 1 winal, 6 k'in = 26 days.
# - maya_day_number (MDN) = bak'tun*144000 + k'atun*7200 + tun*360 + winal*20 + k'in,
#   the same "Maya day number" convention as Kettunen & Helmke 2020, Appendix p. 52.
# - Rollover carries: k'in and tun and k'atun columns carry at 20; the winal
#   column carries at 18. Borrows likewise: 18 borrowed into the winal column,
#   20 into every other column.
# - Calendar Round orthography follows each cited source as published
#   (Kettunen & Helmke: new orthography; Lounsbury 1976: old orthography,
#   e.g. Zac = Sak, Kayab = K'ayab, Ahau = Ajaw).
#
# Sources actually consulted for this file:
# - Kettunen, Harri & Christophe Helmke 2020, Introduction to Maya Hieroglyphs,
#   Wayeb, Appendix p. 52, table "An Example of the Correlation of the Long
#   Count, Tzolk'in, Haab, and the Lords of the Night" (day-by-day table
#   9.8.19.17.14 .. 9.9.0.1.4) and p. 52 Maya-day-number worked example
#   (9.15.6.14.6 = 1406446). https://www.mesoweb.com/resources/handbook/IMH2020.pdf
# - Lounsbury, Floyd G. 1976, "A Rationale for the Initial Date of the Temple
#   of the Cross at Palenque", in The Art, Iconography and Dynastic History of
#   Palenque, Part III (Proceedings of the Segunda Mesa Redonda de Palenque),
#   ed. Merle Greene Robertson, pp. 211-224, at p. 220 and p. 220 n. 18.
#   https://www.mesoweb.org/pari/publications/RT03/Rationale.pdf

# --- winal rollover (k'in column wraps at 20) ---

- id: "dn-winal-fwd_anchor-9.9.0.0.16_plus-6"
  long_count: "9.9.0.1.2"
  calendar_round: "12 Ik' 5 Sek"
  lord_of_night: G4
  maya_day_number: 1360822
  provenance: derived
  source: "Kettunen & Helmke 2020, Introduction to Maya Hieroglyphs, Wayeb, Appendix p. 52, correlation table (both endpoint rows: 9.9.0.0.16 = 6 Kib 19 Sotz' G7; 9.9.0.1.2 = 12 Ik' 5 Sek G4)"
  checked: "2026-09-21"
  notes: |
    Direction: forward across the winal rollover (k'in column wraps at 20).
    Anchor: 9.9.0.0.16 (6 Kib 19 Sotz', G7), anchor MDN = 9*144000 + 9*7200 + 0*360 + 0*20 + 16 = 1296000 + 64800 + 16 = 1360816.
    DN: 6 (6 k'in) = 6 days.
    Column-wise addition with carries: k'in 16 + 6 = 22 -> write 2, carry 1 winal; winal 0 + 0 + 1 = 1; tun 0; k'atun 9; bak'tun 9 => 9.9.0.1.2.
    Reconciliation: result MDN = anchor MDN + DN days = 1360816 + 6 = 1360822 = 9*144000 + 9*7200 + 0*360 + 1*20 + 2.
    The DN vector itself is this file's construction (hence derived); both endpoint Long Counts, Calendar Rounds and Lords of the Night are read from the cited published table, which lists every day from 9.8.19.17.14 to 9.9.0.1.4.

- id: "dn-winal-bwd_anchor-9.9.0.1.4_minus-8"
  long_count: "9.9.0.0.16"
  calendar_round: "6 Kib 19 Sotz'"
  lord_of_night: G7
  maya_day_number: 1360816
  provenance: derived
  source: "Kettunen & Helmke 2020, Introduction to Maya Hieroglyphs, Wayeb, Appendix p. 52, correlation table (both endpoint rows: 9.9.0.1.4 = 1 K'an 7 Sek G6; 9.9.0.0.16 = 6 Kib 19 Sotz' G7)"
  checked: "2026-09-21"
  notes: |
    Direction: backward across the winal rollover.
    Anchor: 9.9.0.1.4 (1 K'an 7 Sek, G6), anchor MDN = 9*144000 + 9*7200 + 0*360 + 1*20 + 4 = 1360824.
    DN: 8 (8 k'in) = 8 days, subtracted.
    Column-wise subtraction with borrows: k'in 4 - 8 < 0, borrow 20 from the winal column: 4 + 20 - 8 = 16; winal 1 - 1 (borrow) = 0; tun 0; k'atun 9; bak'tun 9 => 9.9.0.0.16.
    Reconciliation: result MDN = anchor MDN - DN days = 1360824 - 8 = 1360816 = 9*144000 + 9*7200 + 0*360 + 0*20 + 16.
    Uses a different anchor (9.9.0.1.4) and a different DN than the forward winal vector, so the pair is not an algebraic inverse. Endpoint LC/CR/G values are read from the cited published table.

# --- tun rollover (winal column wraps at 18) ---

