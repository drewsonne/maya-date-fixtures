# --- published-inscription DN vectors (Palenque Temple XVIII, Lounsbury 1976:220) ---

- id: "dn-palenque-t18-fwd_anchor-9.12.6.5.8_plus-2.3.16.14"
  long_count: "9.14.10.4.2"
  calendar_round: "9 Ik 5 Kayab"
  maya_day_number: 1400482
  provenance: attested
  source: "Lounsbury, Floyd G. 1976, A Rationale for the Initial Date of the Temple of the Cross at Palenque, in The Art, Iconography and Dynastic History of Palenque, Part III (Segunda Mesa Redonda de Palenque), ed. M. G. Robertson, pp. 211-224, at p. 220 (Palenque Temple XVIII jambs, passages A3-A15 and D5-D7)"
  checked: "2026-09-21"
  notes: |
    Published inscription DN, forward. Palenque Temple XVIII jambs: the ruler's birth is recorded as the Initial Series 9.12.6.5.8, 3 Lamat 6 Zac (passage A3-A15), and his accession (D5-D7) is stated to be a DN of 2.3.16.14 after his birth, fixing the accession at 9.14.10.4.2, 9 Ik 5 Kayab. Anchor LC, DN and target LC/CR are all as published at Lounsbury 1976:220 (old orthography retained as published; Zac = Sak, Kayab = K'ayab).
    Anchor: 9.12.6.5.8 (3 Lamat 6 Zac), anchor MDN = 9*144000 + 12*7200 + 6*360 + 5*20 + 8 = 1296000 + 86400 + 2160 + 100 + 8 = 1384668.
    DN: 2.3.16.14 (2 k'atun, 3 tun, 16 winal, 14 k'in) = 2*7200 + 3*360 + 16*20 + 14 = 14400 + 1080 + 320 + 14 = 15814 days.
    Column-wise addition with carries: k'in 8 + 14 = 22 -> write 2, carry 1 winal; winal 5 + 16 + 1 = 22 -> write 22 - 18 = 4, carry 1 tun (winal is base-18); tun 6 + 3 + 1 = 10; k'atun 12 + 2 = 14; bak'tun 9 => 9.14.10.4.2, crossing both the winal and the tun rollover.
    Reconciliation: result MDN = anchor MDN + DN days = 1384668 + 15814 = 1400482 = 9*144000 + 14*7200 + 10*360 + 4*20 + 2.

- id: "dn-palenque-t18-bwd_anchor-9.14.10.4.2_minus-7.14.9.12.0"
  long_count: "2.0.0.10.2"
  calendar_round: "9 Ik 0 Zac"
  maya_day_number: 288202
  provenance: attested
  source: "Lounsbury, Floyd G. 1976, A Rationale for the Initial Date of the Temple of the Cross at Palenque, in The Art, Iconography and Dynastic History of Palenque, Part III (Segunda Mesa Redonda de Palenque), ed. M. G. Robertson, pp. 211-224, at p. 220 and p. 221 (Palenque Temple XVIII jambs, passage C8-C13; DN day total 1,112,280 stated in the source's factorization)"
  checked: "2026-09-21"
  notes: |
    Published inscription DN, backward. Palenque Temple XVIII (C8-C13) characterizes the ruler's accession as 7.14.9.12.0 after the 'accession' of the mythological lady of the Tablet of the Cross, on a day 9 Ik 0 Zac; Lounsbury states that this DN, subtracted from the accession date 9.14.10.4.2, fixes that day at 2.0.0.10.2, and gives the DN's day total 7.14.9.12.0 = 1,112,280 (p. 221). Anchor LC/CR, DN, target LC/CR and the DN day count are all as published (old orthography retained; Zac = Sak).
    Anchor: 9.14.10.4.2 (9 Ik 5 Kayab), anchor MDN = 9*144000 + 14*7200 + 10*360 + 4*20 + 2 = 1400482.
    DN: 7.14.9.12.0 (7 bak'tun, 14 k'atun, 9 tun, 12 winal, 0 k'in) = 7*144000 + 14*7200 + 9*360 + 12*20 + 0 = 1008000 + 100800 + 3240 + 240 = 1112280 days, subtracted (matches the published total 1,112,280).
    Column-wise subtraction with borrows: k'in 2 - 0 = 2; winal 4 - 12 < 0, borrow 18 from tun (winal is base-18): 4 + 18 - 12 = 10; tun 10 - 1 (borrow) - 9 = 0; k'atun 14 - 14 = 0; bak'tun 9 - 7 = 2 => 2.0.0.10.2. The interval reaches back across the bak'tun endings 9.0.0.0.0 through 3.0.0.0.0.
    Reconciliation: result MDN = anchor MDN - DN days = 1400482 - 1112280 = 288202 = 2*144000 + 0*7200 + 0*360 + 10*20 + 2.

- id: "dn-tc-heir-bwd_anchor-9.10.10.0.0_minus-1.8.17"
  long_count: "9.10.8.9.3"
  calendar_round: "9 Akbal 6 Xul"
  maya_day_number: 1371063
  provenance: derived
  source: "Anchor, DN and target Calendar Round from Lounsbury 1976, A Rationale for the Initial Date of the Temple of the Cross at Palenque, Segunda Mesa Redonda de Palenque Part III, p. 220 n. 18 (Tablet of the Cross, passage K7-K10: 1.8.17 from 9 Akbal 6 Xul to the lahuntun ending 13 Ahau 18 Kankin, 9.10.10.0.0); target Long Count hand-derived below"
  checked: "2026-09-21"
  notes: |
    Published inscription DN, backward, anchored on a period ending. Tablet of the Cross (Palenque), K7-K10: it was 1.8.17 from the day 9 Akbal 6 Xul (heir-designation of Chan-Bahlum) to the lahuntun ending 13 Ahau 18 Kankin, 9.10.10.0.0 (Lounsbury 1976:220 n. 18, old orthography as published). Counting backward from the period ending recovers the event's Long Count, which the source does not print; the target LC here is therefore hand-derived (record marked derived), while anchor LC/CR, DN and target CR are as published.
    Anchor: 9.10.10.0.0 (13 Ahau 18 Kankin), anchor MDN = 9*144000 + 10*7200 + 10*360 + 0 + 0 = 1296000 + 72000 + 3600 = 1371600.
    DN: 1.8.17 (1 tun, 8 winal, 17 k'in) = 360 + 160 + 17 = 537 days, subtracted.
    Column-wise subtraction with borrows: k'in 0 - 17 < 0, borrow 20 from winal: 0 + 20 - 17 = 3; winal 0 - 1 (borrow) - 8 = -9 < 0, borrow 18 from tun (winal is base-18): -9 + 18 = 9; tun 10 - 1 (borrow) - 1 = 8; k'atun 10; bak'tun 9 => 9.10.8.9.3, crossing back over the winal and tun rollovers.
    Reconciliation: result MDN = anchor MDN - DN days = 1371600 - 537 = 1371063 = 9*144000 + 10*7200 + 8*360 + 9*20 + 3.
    Consistency check of the published target CR against the derived LC (era base 13.0.0.0.0 = 4 Ajaw 8 Kumk'u): tzolk'in coefficient (4 + 1371063) mod 13 = 9; tzolk'in day (19 + 1371063) mod 20 = index 2 = Akbal; haab (348 + 1371063) mod 365 = 106 = 6 Xul. Matches the published 9 Akbal 6 Xul.

# --- chained vector (anchor + two successive DNs) ---

- id: "dn-chain-palenque-t18_anchor-9.12.6.5.8_plus-2.3.16.14_minus-7.14.9.12.0"
  long_count: "2.0.0.10.2"
  calendar_round: "9 Ik 0 Zac"
  maya_day_number: 288202
  provenance: attested
  source: "Lounsbury, Floyd G. 1976, A Rationale for the Initial Date of the Temple of the Cross at Palenque, in The Art, Iconography and Dynastic History of Palenque, Part III (Segunda Mesa Redonda de Palenque), ed. M. G. Robertson, pp. 211-224, at pp. 220-221 (Palenque Temple XVIII jambs, passages A3-A15, D5-D7 and C8-C13)"
  checked: "2026-09-21"
  notes: |
    Chained vector: one anchor, two successive published DNs; anchor, both DNs, the intermediate date and the final date are all as published in the Temple XVIII inscription per Lounsbury 1976:220-221 (old orthography retained as published).
    Anchor: 9.12.6.5.8 (3 Lamat 6 Zac, the ruler's birth Initial Series), anchor MDN = 9*144000 + 12*7200 + 6*360 + 5*20 + 8 = 1384668.
    Link 1 (forward): DN 2.3.16.14 = 2*7200 + 3*360 + 16*20 + 14 = 15814 days. Column-wise: k'in 8 + 14 = 22 -> 2 carry 1; winal 5 + 16 + 1 = 22 -> 22 - 18 = 4 carry 1 (base-18); tun 6 + 3 + 1 = 10; k'atun 12 + 2 = 14; bak'tun 9. This link crosses the winal and tun rollovers.
    INTERMEDIATE RESULT (asserted): 9.14.10.4.2 (9 Ik 5 Kayab, the ruler's accession), MDN = 1384668 + 15814 = 1400482 = 9*144000 + 14*7200 + 10*360 + 4*20 + 2.
    Link 2 (backward): DN 7.14.9.12.0 = 1112280 days (day total as published), subtracted. Column-wise: k'in 2 - 0 = 2; winal 4 - 12 < 0, borrow 18 from tun: 4 + 18 - 12 = 10; tun 10 - 1 - 9 = 0; k'atun 14 - 14 = 0; bak'tun 9 - 7 = 2. This link reaches back across seven bak'tun endings.
    FINAL RESULT (this record): 2.0.0.10.2 (9 Ik 0 Zac, 'accession' of the mythological lady of the Tablet of the Cross), MDN = 1400482 - 1112280 = 288202 = 2*144000 + 10*20 + 2.
    Reconciliation: 1384668 + 15814 - 1112280 = 288202.
