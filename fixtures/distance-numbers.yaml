# --- k'atun rollover (tun column wraps at 20) ---

- id: "dn-katun-fwd_anchor-9.8.19.17.14_plus-1.6"
  long_count: "9.9.0.1.0"
  calendar_round: "10 Ajaw 3 Sek"
  lord_of_night: G2
  maya_day_number: 1360820
  provenance: derived
  source: "Kettunen & Helmke 2020, Introduction to Maya Hieroglyphs, Wayeb, Appendix p. 52, correlation table (both endpoint rows: 9.8.19.17.14 = 10 Ix 17 Sip G3; 9.9.0.1.0 = 10 Ajaw 3 Sek G2)"
  checked: "2026-09-21"
  notes: |
    Direction: forward across the k'atun rollover (the carry cascades k'in -> winal -> tun -> k'atun, crossing the k'atun ending 9.9.0.0.0 3 Ajaw 3 Sotz').
    Anchor: 9.8.19.17.14 (10 Ix 17 Sip, G3), anchor MDN = 9*144000 + 8*7200 + 19*360 + 17*20 + 14 = 1296000 + 57600 + 6840 + 340 + 14 = 1360794.
    DN: 1.6 (1 winal, 6 k'in) = 1*20 + 6 = 26 days.
    Column-wise addition with carries: k'in 14 + 6 = 20 -> write 0, carry 1 winal; winal 17 + 1 + 1 = 19 -> exceeds 17, write 19 - 18 = 1, carry 1 tun (winal is base-18); tun 19 + 0 + 1 = 20 -> write 0, carry 1 k'atun; k'atun 8 + 0 + 1 = 9; bak'tun 9 => 9.9.0.1.0.
    Reconciliation: result MDN = anchor MDN + DN days = 1360794 + 26 = 1360820 = 9*144000 + 9*7200 + 0*360 + 1*20 + 0.
    Both endpoint LC/CR/G values are read from the cited published table; the DN vector construction and arithmetic are this file's (hence derived).

