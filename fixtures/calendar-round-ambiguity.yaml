# Calendar Round ambiguity fixtures (package wave-2-cr-ambiguity).
#
# A Calendar Round (or a partial Calendar Round) does not name a unique Long Count;
# it names a candidate set within any stated window. Each group below pins one such
# set: one record per candidate, grouped by a shared id prefix, with the window
# (explicit endpoints), the full set, the pairwise separations, and the completeness
# arithmetic repeated verbatim in every record of the group so a reviewer can
# recompute the set size from the window alone.
#
# Groups:
#   cr-5kib-14chen-baktun9-*  full CR 5 Kib 14 Ch'en over the natural window bak'tun 9 (7 candidates)
#   cr-5kib-14chen-katun917-* full CR 5 Kib 14 Ch'en over k'atun 9.17 (1 candidate)
#   haab-14chen-katun917-*    partial (haab-only) '14 Ch'en over the same k'atun 9.17 (20 candidates)
#
# Anchor for all three groups: 9.17.19.13.16 5 Kib 14 Ch'en (MDN 1425516), Santa Elena
# Poco Uinic Stela 3, attested in Martin & Skidmore 2012 (The PARI Journal 13(2),
# pp. 6 and 9 - actually consulted) and independently verified by the residue
# computations in the notes. All other members are hand-derived from the anchor by
# exact multiples of the relevant recurrence (18980 days for a full CR, 365 days for
# a haab-only partial); no value in this file was produced by running any calendar
# implementation.

- id: cr-5kib-14chen-baktun9-01
  long_count: "9.2.3.7.16"
  calendar_round: "5 Kib 14 Ch'en"
  maya_day_number: 1311636
  provenance: derived
  checked: "2026-09-21"
  notes: >-
    THIS RECORD: member 1 of 7. MDN = 1425516 - 6*18980 = 1311636. Window offset 1311636 - 1296000 =
    15636 = 2*7200 + 3*360 + 7*20 + 16, giving Long Count 9.2.3.7.16. Its Calendar Round equals the
    anchor's (5 Kib 14 Ch'en) because a step of 6*18980 days is a whole number of Calendar Rounds, and
    18980 = lcm(260, 365) preserves both tzolk'in and haab. GROUP cr-5kib-14chen-baktun9 - one record
    per candidate; this block is identical in every record of the group. Target: the full Calendar Round
    5 Kib 14 Ch'en. WINDOW (explicit endpoints): 9.0.0.0.0 (MDN 1296000, inclusive) to 10.0.0.0.0 (MDN
    1440000, exclusive) - a natural window, the whole of bak'tun 9, length 144000 days. FULL CANDIDATE
    SET (7 members): 9.2.3.7.16 (MDN 1311636); 9.4.16.2.16 (MDN 1330616); 9.7.8.15.16 (MDN 1349596);
    9.10.1.10.16 (MDN 1368576); 9.12.14.5.16 (MDN 1387556); 9.15.7.0.16 (MDN 1406536); 9.17.19.13.16
    (MDN 1425516). SEPARATIONS: consecutive members differ by exactly 18980 days (one Calendar Round);
    members i and j (1-indexed) differ by (j - i) * 18980; relative to the first member the offsets are
    0, 18980, 37960, 56940, 75920, 94900, 113880 days. COMPLETENESS (recomputable from the window
    alone): anchor MDN 1425516 mod 18980 = 2016 (18980*75 = 1423500); window start 1296000 mod 18980 =
    5360 (18980*68 = 1290640); first occurrence at window offset (2016 - 5360) + 18980 = 15636, i.e. MDN
    1311636. Window length 144000 = 7*18980 + 11140; since the first offset 15636 >= the remainder
    11140, the count is floor(144000/18980) = 7: 15636 + 6*18980 = 129516 < 144000 but 15636 + 7*18980 =
    148496 >= 144000. So the set above is complete. Anchor verification for 9.17.19.13.16 (MDN 9*144000
    + 17*7200 + 19*360 + 13*20 + 16 = 1425516, matching the MDN printed in Martin & Skidmore 2012, p.
    9): tzolk'in number: 1425516 = 13*109655 + 1, so (4 + 1) = 5; tzolk'in name: 1425516 mod 20 = 16, so
    (19 + 16) mod 20 = 15 = Kib; together 5 Kib. Haab: 1425516 = 365*3905 + 191, so (348 + 191) mod 365
    = 539 - 365 = 174 = 8*20 + 14 = 14 Ch'en. Result 5 Kib 14 Ch'en agrees with the attested Calendar
    Round (Martin & Skidmore 2012, p. 6). Premises (each checked in a work actually opened, or
    elementary calendar structure): era base 0.0.0.0.0 (completion 13.0.0.0.0) = 4 Ajaw 8 Kumk'u (Martin
    & Skidmore 2012, p. 3: 'the Maya base date of 13.0.0.0.0 4 Ajaw 8 Kumk'u'); positional day values 1
    bak'tun = 144000 d, 1 k'atun = 7200 d, 1 tun = 360 d, 1 winal = 20 d, 1 k'in = 1 d (worked Maya Day
    Number example, Martin & Skidmore 2012, p. 4); tzolk'in period 260 d (13 numbers x 20 names; names
    indexed Imix=0 .. Ajaw=19, so 4 Ajaw at the era base gives number (4 + MDN) mod 13 mapped to 1..13
    and name index (19 + MDN) mod 20; Kib = index 15); haab period 365 d (18 months of 20 d + 5 d Wayeb;
    months indexed Pop=0 .. Kumk'u=17, so 8 Kumk'u = position 17*20+8 = 348 and haab position = (348 +
    MDN) mod 365; Ch'en = month index 8, so position 174 = 8*20+14 = 14 Ch'en); Calendar Round period
    lcm(260, 365) = 18980 d.

